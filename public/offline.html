<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>オフラインです | UKATTA</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fdfeff;
        color: #0e1526;
        font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
        padding: 24px;
      }
      .box {
        max-width: 22rem;
        text-align: center;
      }
      .brand {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        color: #2b5fd9;
        font-weight: 700;
      }
      h1 {
        margin: 0.75rem 0 0;
        font-size: 1.25rem;
      }
      p {
        color: #5b6b8c;
        font-size: 0.875rem;
        line-height: 1.7;
      }
      button {
        margin-top: 1.5rem;
        border: 0;
        border-radius: 9999px;
        background: #2b5fd9;
        color: #fff;
        font-weight: 700;
        padding: 0.75rem 2rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p class="brand">UKATTA</p>
      <h1>オフラインです</h1>
      <p>
        インターネットに接続されていないため、学習データを読み込めませんでした。<br />
        電波の届く場所で、もう一度お試しください。
      </p>
      <button onclick="location.reload()">再読み込み</button>
    </div>
  </body>
</html>
